<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% block title %}LinkForge{% endblock %}</title>
  <link rel="stylesheet" href="/static/styles.css" />
  <script src="https://unpkg.com/htmx.org@1.9.12" defer></script>
  <link rel="icon"
    href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='14' font-size='14'>🔗</text></svg>" />
</head>
<body>
  <nav class="nav">
    <div class="nav-inner">
      <a class="brand" href="/"><span class="brand-mark">🔗</span> LinkForge</a>
      <div class="nav-links">
        <a href="/">Shorten</a>
        <a href="/dashboard">Dashboard</a>
      </div>
    </div>
  </nav>
  <main class="container">
    {% block content %}{% endblock %}
  </main>
  <footer class="footer">
    <div class="footer-inner">
      <p class="footer-tech">FastAPI · PostgreSQL · Redis · HTMX</p>
      <p class="footer-note">
        Cache-aside redirects · distributed rate limiting · batched analytics ingestion
      </p>
    </div>
  </footer>
</body>
</html>
